[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qweave"
version = "0.2.0"
description = "Deterministic qubit allocation and routing research core"
requires-python = ">=3.11"
dependencies = [
  "qiskit>=1.0",
  "gymnasium>=1.0",
  "networkx>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "ortools>=9.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis", "httpx>=0.27"]
learning = ["torch>=2.2"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
paper = ["python-docx>=1.1", "reportlab>=4.0"]

[project.scripts]
qweave = "qweave.cli:main"

[tool.setuptools.packages.find]
include = ["qweave*", "web*"]

[tool.setuptools.package-data]
web = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

